<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTRA // INSTAGRAM 4:5 CAROUSEL STUDIO (1080x1350)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050608;
      --bg-panel: #0C0F16;
      --audi-red: #E3000F;
      --hud-cyan: #00E5FF;
      --hud-emerald: #00E676;
      --hud-amber: #FFAB00;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-stealth: #222938;
      --font-mono: 'Share Tech Mono', monospace;
      --font-sans: 'Share Tech Mono', 'Zen Kaku Gothic New', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .studio-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 11, 16, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--audi-red);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .studio-brand span.slash { color: var(--audi-red); }
    .studio-badge {
      font-size: 0.72rem;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid var(--hud-cyan);
      color: var(--hud-cyan);
      padding: 3px 8px;
      letter-spacing: 1px;
    }

    .studio-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ctrl-btn {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 900;
      padding: 9px 16px;
      border: 1px solid #334155;
      background: #121722;
      color: #FFFFFF;
      cursor: pointer;
      letter-spacing: 0.8px;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn:hover {
      border-color: var(--hud-cyan);
      background: #192232;
    }

    .ctrl-btn.primary {
      background: var(--audi-red);
      border-color: #FF4D58;
      box-shadow: 0 0 18px rgba(227, 0, 15, 0.4);
    }

    .ctrl-btn.primary:hover {
      background: #FF1A29;
      transform: translateY(-1px);
    }

    .ctrl-btn.lang-active {
      border-color: var(--hud-cyan);
      color: var(--hud-cyan);
      background: rgba(0, 229, 255, 0.14);
    }

    .toolbar-panel {
      max-width: 1400px;
      margin: 22px auto 10px;
      padding: 0 20px;
    }

    .upload-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border-stealth);
      border-left: 4px solid var(--hud-cyan);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .upload-info h3 {
      font-size: 0.96rem;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .upload-info p {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid var(--hud-emerald);
      color: var(--hud-emerald);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 900;
      padding: 9px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-label:hover {
      background: rgba(0, 230, 118, 0.24);
      color: #FFFFFF;
    }

    input[type="file"] { display: none; }

    /* スライド一覧グリッド */
    .slides-grid {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
    }

    .slide-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-stealth);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
    }

    .slide-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1E2532;
      padding-bottom: 8px;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--hud-cyan);
      letter-spacing: 1px;
    }

    .slide-spec {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    .canvas-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #050608;
      border: 1px solid #2A3342;
      overflow: hidden;
      position: relative;
    }

    .canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slide-actions {
      display: flex;
      gap: 8px;
    }

    .dl-single-btn {
      flex: 1;
      background: #161C28;
      border: 1px solid #334155;
      border-left: 3px solid var(--audi-red);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-weight: 900;
      font-size: 0.8rem;
      padding: 9px 12px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .dl-single-btn:hover {
      background: var(--audi-red);
      border-color: var(--audi-red);
    }

    @media (max-width: 600px) {
      .studio-header { padding: 12px 14px; }
      .slides-grid { grid-template-columns: 1fr; padding: 0 14px; }
      .toolbar-panel { padding: 0 14px; }
    }
  </style>
</head>
<body>

  <header class="studio-header">
    <div class="studio-brand">
      <span class="slash">//</span> VECTRA INSTA STUDIO
      <span class="studio-badge">4:5 CAROUSEL (1080×1350px)</span>
    </div>

    <div class="studio-controls">
      <button type="button" id="btnLangJp" class="ctrl-btn lang-active">JP 日本語版 (7枚)</button>
      <button type="button" id="btnLangEn" class="ctrl-btn">EN 英語版 (7枚)</button>
      <button type="button" id="btnDownloadAll" class="ctrl-btn primary">⬇ 全7枚を一括PNG保存 (1080×1350)</button>
    </div>
  </header>

  <div class="toolbar-panel">
    <div class="upload-bar">
      <div class="upload-info">
        <h3>📸 実機スクリーンショット自動合成（そのままでも高精細ベクター描画で即保存可能！）</h3>
        <p id="uploadStatusText">
          「258802.jpg（RS設定画面）」やマップのスクショ（Screenshot_*.jpg）を選択すると、スライド01・04・05のスマホ枠へ即座に実機画像がハメ込まれます。
        </p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <label class="file-label">
          📂 スクショ画像を選択（複数可）
          <input type="file" id="fileInput" accept="image/*" multiple />
        </label>
      </div>
    </div>
  </div>

  <main class="slides-grid" id="slidesContainer"></main>

  <!-- QRコード生成用軽量ライブラリ（Slide 07用・フォールバック内蔵） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <script>
    (function() {
      var W = 1080;
      var H = 1350;
      var isEn = false;

      // 読み込まれた画像キャッシュ（キー: 'rs', 'map1', 'map2', 'map3', 'map4'）
      var loadedImages = {
        rs: null,
        map1: null,
        map2: null,
        map3: null,
        map4: null
      };

      var qrCanvas = document.createElement('canvas');
      function generateQrCode() {
        var url = isEn
          ? 'https://vectra-hud.github.io/vectra-manual/?lang=en'
          : 'https://vectra-hud.github.io/vectra-manual/';
        if (window.QRious) {
          new QRious({
            element: qrCanvas,
            value: url,
            size: 260,
            background: '#FFFFFF',
            foreground: '#050608',
            level: 'M'
          });
        }
      }

      var SLIDE_META = [
        { num: '01', nameJa: '表紙：VECTRA 11月中旬公開予告', nameEn: 'Cover: VECTRA Mid-Nov Launch' },
        { num: '02', nameJa: '走り屋モード＆首都高C1無限周回', nameEn: 'Runner Mode & Shutoko C1 Radar' },
        { num: '03', nameJa: '全国高速スタバ49箇所＆GAS捕捉', nameEn: '49 Starbucks & GAS Auto-Radar' },
        { num: '04', nameJa: 'VECTRA RS デュアル音声＆160MB先読み', nameEn: 'VECTRA RS Dual Voice & Preloader' },
        { num: '05', nameJa: '実機7種タクティカル・マップ切替', nameEn: '7 Tactical Map Styles Showcase' },
        { num: '06', nameJa: 'U字タブ3拠点＆日英1タップ切替', nameEn: 'U-Tab 3 Quick Pins & EN/JP HUD' },
        { num: '07', nameJa: '先行20名枠満員御礼＆公式マニュアルQR', nameEn: 'Beta Full & Official Manual QR' }
      ];

      var canvases = [];
      var container = document.getElementById('slidesContainer');

      function initSlideDOM() {
        container.innerHTML = '';
        canvases = [];
        for (var i = 0; i < SLIDE_META.length; i++) {
          (function(idx) {
            var meta = SLIDE_META[idx];
            var card = document.createElement('div');
            card.className = 'slide-card';

            var top = document.createElement('div');
            top.className = 'slide-card-top';
            top.innerHTML =
              '<span class="slide-num">SLIDE ' + meta.num + ' // ' + (isEn ? meta.nameEn : meta.nameJa) + '</span>' +
              '<span class="slide-spec">1080×1350 (4:5)</span>';

            var wrap = document.createElement('div');
            wrap.className = 'canvas-wrap';
            var cv = document.createElement('canvas');
            cv.width = W;
            cv.height = H;
            wrap.appendChild(cv);
            canvases.push(cv);

            var actions = document.createElement('div');
            actions.className = 'slide-actions';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'dl-single-btn';
            btn.textContent = '⬇ SLIDE ' + meta.num + ' をPNG保存';
            btn.addEventListener('click', function() {
              downloadCanvasAsPng(cv, idx + 1);
            });
            actions.appendChild(btn);

            card.appendChild(top);
            card.appendChild(wrap);
            card.appendChild(actions);
            container.appendChild(card);
          })(i);
        }
      }

      // 同一フォルダにある画像（GitHub Pages上など）の自動プリロード試行
      function tryAutoLoadLocalFiles() {
        var candidates = [
          { key: 'rs', file: '258802.jpg' },
          { key: 'map1', file: 'Screenshot_20261029_183622.jpg' },
          { key: 'map2', file: 'Screenshot_20261029_183524.jpg' },
          { key: 'map3', file: 'Screenshot_20261029_183726.jpg' },
          { key: 'map4', file: 'Screenshot_20261029_183419.jpg' }
        ];
        candidates.forEach(function(item) {
          var img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function() {
            // file:// 直開き時は汚染チェックを行い、toDataURLが使える場合のみ採用
            try {
              var testCv = document.createElement('canvas');
              testCv.width = 2; testCv.height = 2;
              testCv.getContext('2d').drawImage(img, 0, 0, 2, 2);
              testCv.toDataURL('image/png');
              loadedImages[item.key] = img;
              renderAllSlides();
            } catch (e) {
              // file:// 時は上部のファイル選択からDataURL読み込みを使えば100%回避可能
            }
          };
          img.src = item.file;
        });
      }

      // ユーザーによるファイル選択（DataURL化するためCORS制限100%ゼロ）
      var fileInput = document.getElementById('fileInput');
      var statusText = document.getElementById('uploadStatusText');
      if (fileInput) {
        fileInput.addEventListener('change', function(ev) {
          var files = Array.prototype.slice.call(ev.target.files || []);
          if (!files.length) return;
          var mapIdx = 1;
          var loadedCount = 0;

          files.forEach(function(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
              var img = new Image();
              img.onload = function() {
                var fname = file.name.toLowerCase();
                if (fname.indexOf('258802') !== -1 || fname.indexOf('003008') !== -1 || fname.indexOf('rs') !== -1 || files.length === 1) {
                  loadedImages.rs = img;
                } else {
                  if (mapIdx <= 4) {
                    loadedImages['map' + mapIdx] = img;
                    mapIdx++;
                  }
                }
                loadedCount++;
                if (loadedCount === files.length) {
                  statusText.textContent = '✅ ' + loadedCount + '枚のスクリーンショットをスライドへ高解像度合成しました！そのままPNG保存できます。';
                  statusText.style.color = '#00E676';
                  renderAllSlides();
                }
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(file);
          });
        });
      }

      // =========================================================================
      // 共通Canvas描画ヘルパー群
      // =========================================================================
      function drawTacticalBackground(ctx, slideNumStr, totalStr) {
        var grad = ctx.createRadialGradient(W * 0.5, H * 0.15, 50, W * 0.5, H * 0.5, H * 0.9);
        grad.addColorStop(0, '#161C28');
        grad.addColorStop(0.55, '#0A0D13');
        grad.addColorStop(1, '#040507');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // グリッド線
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.028)';
        ctx.lineWidth = 1;
        for (var x = 0; x < W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (var y = 0; y < H; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // 外周タクティカルフレーム
        ctx.strokeStyle = '#1E2636';
        ctx.lineWidth = 3;
        ctx.strokeRect(28, 28, W - 56, H - 56);

        // 上部赤アクセントライン
        ctx.fillStyle = '#E3000F';
        ctx.fillRect(28, 28, W - 56, 6);

        // トップヘッダーバー
        ctx.fillStyle = 'rgba(8, 11, 16, 0.9)';
        ctx.fillRect(30, 34, W - 60, 76);
        ctx.strokeStyle = '#222A38';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(30, 110); ctx.lineTo(W - 30, 110); ctx.stroke();

        // 左上 // VECTRA
        ctx.font = '900 32px "Share Tech Mono", monospace';
        ctx.fillStyle = '#E3000F';
        ctx.textAlign = 'left';
        ctx.fillText('//', 58, 83);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('VECTRA', 102, 83);

        // 中央ステータス
        ctx.font = 'bold 21px "Share Tech Mono", monospace';
        ctx.fillStyle = '#00E5FF';
        ctx.textAlign = 'center';
        ctx.fillText('TACTICAL HIGHWAY HUD // v4.0.0', W * 0.5, 80);

        // 右上 ページ番号
        ctx.font = 'bold 26px "Share Tech Mono", monospace';
        ctx.fillStyle = '#94A3B8';
        ctx.textAlign = 'right';
        ctx.fillText(slideNumStr + ' / ' + totalStr, W - 58, 82);

        // ボトムフッターバー
        ctx.fillStyle = 'rgba(8, 11, 16, 0.92)';
        ctx.fillRect(30, H - 96, W - 60, 66);
        ctx.strokeStyle = '#222A38';
        ctx.beginPath(); ctx.moveTo(30, H - 96); ctx.lineTo(W - 30, H - 96); ctx.stroke();

        ctx.font = 'bold 22px "Share Tech Mono", monospace';
        ctx.fillStyle = '#94A3B8';
        ctx.textAlign = 'left';
        ctx.fillText('2021 AUDI TT RS TESTED // ANDROID EXCLUSIVE', 58, H - 55);

        ctx.fillStyle = slideNumStr === '07' ? '#00E676' : '#E3000F';
        ctx.textAlign = 'right';
        ctx.fillText(slideNumStr === '07' ? 'CHECK LINK IN BIO ▸' : 'SWIPE NEXT ▸▸', W - 58, H - 55);
      }

      // Audi Sport風 RS エンブレム描画
      function drawRsEmblem(ctx, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // 赤い斜め平行四辺形
        ctx.fillStyle = '#E3000F';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(48, 0);
        ctx.lineTo(34, 44);
        ctx.lineTo(0, 44);
        ctx.closePath();
        ctx.fill();

        // 外周シルバーフレーム
        ctx.strokeStyle = 'rgba(209, 213, 219, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(106, 0);
        ctx.lineTo(92, 44);
        ctx.lineTo(0, 44);
        ctx.closePath();
        ctx.stroke();

        ctx.font = 'italic 900 30px "Share Tech Mono", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.fillText('RS', 56, 33);
        ctx.restore();
      }

      // VECTRA ステルスクレスト描画
      function drawVectraCrest(ctx, cx, cy, radius) {
        ctx.save();
        ctx.translate(cx, cy);
        var s = radius / 50;
        ctx.scale(s, s);

        function hexPoly(r) {
          ctx.beginPath();
          for (var i = 0; i < 6; i++) {
            var ang = (i * 60 - 90) * Math.PI / 180;
            var px = Math.cos(ang) * r;
            var py = Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }

        hexPoly(48);
        ctx.fillStyle = '#0B0E15';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        hexPoly(41);
        ctx.strokeStyle = 'rgba(203, 213, 225, 0.38)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // 赤いVシェイプ
        ctx.fillStyle = '#E3000F';
        ctx.beginPath();
        ctx.moveTo(-26, -22);
        ctx.lineTo(0, 32);
        ctx.lineTo(26, -22);
        ctx.lineTo(14, -22);
        ctx.lineTo(0, 9);
        ctx.lineTo(-14, -22);
        ctx.closePath();
        ctx.fill();

        // 中央ホワイトアロー
        ctx.fillStyle = '#F8FAFC';
        ctx.beginPath();
        ctx.moveTo(0, -34);
        ctx.lineTo(9, -15);
        ctx.lineTo(0, -20);
        ctx.lineTo(-9, -15);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // VECTRA タクティカル・カフェアイコン描画
      function drawTacticalCafeIcon(ctx, cx, cy, r) {
        ctx.save();
        ctx.translate(cx, cy);
        var s = r / 50;
        ctx.scale(s, s);

        ctx.beginPath();
        ctx.arc(0, 0, 49, 0, Math.PI * 2);
        ctx.fillStyle = '#042E1D';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, 45, 0, Math.PI * 2);
        ctx.strokeStyle = '#00A862';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(-20, -2);
        ctx.lineTo(16, -2);
        ctx.lineTo(10, 22);
        ctx.lineTo(-14, 22);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(15, 2);
        ctx.lineTo(25, 2);
        ctx.lineTo(22, 15);
        ctx.lineTo(11, 15);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-24, 29);
        ctx.lineTo(20, 29);
        ctx.stroke();

        // 蒸気3本
        [-11, -1, 9].forEach(function(ox) {
          ctx.beginPath();
          ctx.moveTo(ox, -9);
          ctx.lineTo(ox - 3, -17);
          ctx.lineTo(ox + 1, -26);
          ctx.stroke();
        });

        ctx.restore();
      }

      function drawSectionHeader(ctx, numStr, titleStr, subtitleJaOrEn) {
        ctx.textAlign = 'left';
        ctx.font = '900 30px "Share Tech Mono", monospace';
        ctx.fillStyle = '#E3000F';
        ctx.fillText('SECTION ' + numStr, 64, 162);

        ctx.font = '900 44px "Share Tech Mono", "Zen Kaku Gothic New", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(titleStr, 64, 216);

        ctx.fillStyle = '#E3000F';
        ctx.fillRect(64, 234, W - 128, 3);

        ctx.font = '900 30px "Zen Kaku Gothic New", sans-serif';
        ctx.fillStyle = '#00E5FF';
        ctx.fillText(subtitleJaOrEn, 64, 282);
      }

      // =========================================================================
      // SLIDE 01: 表紙（HERO & 11月中旬リリース予告）
      // =========================================================================
      function renderSlide01(ctx) {
        drawTacticalBackground(ctx, '01', '07');

        // トップ告知ピル
        ctx.fillStyle = 'rgba(227, 0, 15, 0.2)';
        ctx.strokeStyle = '#E3000F';
        ctx.lineWidth = 2;
        ctx.fillRect(140, 145, W - 280, 54);
        ctx.strokeRect(140, 145, W - 280, 54);

        ctx.font = '900 25px "Share Tech Mono", "Zen Kaku Gothic New", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.fillText(
          isEn ? '🚀 LAUNCHING MID-NOVEMBER 2026 ON GOOGLE PLAY' : '🚀 2026年11月中旬 Google Play ストア正式公開決定！',
          W * 0.5, 181
        );

        drawVectraCrest(ctx, W * 0.5, 310, 86);

        ctx.font = 'bold 26px "Share Tech Mono", monospace';
        ctx.fillStyle = '#CBD5E1';
        ctx.fillText('NEXT-GEN TACTICAL HIGHWAY HUD', W * 0.5, 435);

        canvases.forEach(function(cv, i) {
          setTimeout(function() {
            downloadCanvasAsPng(cv, i + 1);
          }, i * 350);
        });
      });

      var btnJp = document.getElementById('btnLangJp');
      var btnEn = document.getElementById('btnLangEn');
      btnJp.addEventListener('click', function() {
        isEn = false;
        btnJp.classList.add('lang-active');
        btnEn.classList.remove('lang-active');
        initSlideDOM();
        renderAllSlides();
      });
      btnEn.addEventListener('click', function() {
        isEn = true;
        btnEn.classList.add('lang-active');
        btnJp.classList.remove('lang-active');
        initSlideDOM();
        renderAllSlides();
      });

      initSlideDOM();
      renderAllSlides();
      tryAutoLoadLocalFiles();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
          renderAllSlides();
        });
      }
    })();
  </script>
</body>
</html>
